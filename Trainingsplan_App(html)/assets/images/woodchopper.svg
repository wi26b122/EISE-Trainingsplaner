<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-036" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-036)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-036</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-036">
    
  <!-- High cable pulley left -->
  <circle cx="70" cy="35" r="7" fill="#475569"/>
  <!-- Diagonal cable across body -->
  <line x1="75" y1="38" x2="145" y2="110" stroke="#64748b" stroke-width="2.5"/>
  <!-- Athlete rotating torso diagonally down -->
  <circle cx="160" cy="70" r="10" fill="#f59e0b"/>
  <line x1="160" y1="80" x2="155" y2="130" stroke="#1e293b" stroke-width="8"/>
  <line x1="155" y1="130" x2="140" y2="178" stroke="#1e293b" stroke-width="7"/>
  <line x1="155" y1="130" x2="170" y2="178" stroke="#1e293b" stroke-width="7"/>
  <!-- Arms swinging down diagonally -->
  <line x1="160" y1="85" x2="145" y2="110" stroke="#e11d48" stroke-width="6"/>
  <line x1="145" y1="110" x2="130" y2="140" stroke="#e11d48" stroke-width="6"/>
  <!-- Diagonal rotation arrow -->
  <path d="M 125,75 Q 160,110 120,150" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="180" y="45" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">DIAGONALE ROTATION</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Kabelzug Holzfäller (Woodchopper)</text>
</svg>