<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-033" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-033)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-033</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-033">
    
  <line x1="30" y1="180" x2="270" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="140" cy="55" r="10" fill="#f59e0b"/>
  <line x1="140" y1="65" x2="140" y2="120" stroke="#1e293b" stroke-width="8"/>
  <!-- Walking legs striding forward -->
  <line x1="140" y1="120" x2="160" y2="178" stroke="#1e293b" stroke-width="7"/>
  <line x1="140" y1="120" x2="120" y2="175" stroke="#1e293b" stroke-width="7"/>
  <!-- Arms carrying two massive weights -->
  <line x1="135" y1="72" x2="125" y2="120" stroke="#e11d48" stroke-width="6"/>
  <line x1="145" y1="72" x2="155" y2="120" stroke="#e11d48" stroke-width="6"/>
  <rect x="115" y="115" width="20" height="28" rx="4" fill="#0f172a"/>
  <rect x="145" y="115" width="20" height="28" rx="4" fill="#0f172a"/>
  <!-- Forward walking arrow -->
  <path d="M 175,100 L 210,100 M 202,95 L 212,100 L 202,105" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="210" y="85" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">VORWÄRTS GEHEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Farmer's Walk</text>
