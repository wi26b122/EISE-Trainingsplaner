<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-003" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-003)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-003</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-003">
    
  <!-- Athlete bent over at 45 degrees -->
  <circle cx="95" cy="85" r="10" fill="#f59e0b"/>
  <line x1="95" y1="95" x2="150" y2="115" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="165" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="140" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Rowing Arm pulled back -->
  <line x1="125" y1="105" x2="135" y2="78" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <circle cx="135" cy="78" r="9" fill="#0284c7"/>
  <!-- Movement arrow towards hip -->
  <path d="M 120,135 L 132,95 M 125,100 L 133,92 L 137,102" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="175" y="75" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">ZUG ZUR HÜFTE</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Kurzhantel-Rudern vorgebeugt</text>
</svg>