<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-011" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-011)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-011</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-011">
    
  <!-- Machine vertical guides -->
  <line x1="90" y1="40" x2="90" y2="175" stroke="#64748b" stroke-width="4"/>
  <line x1="210" y1="40" x2="210" y2="175" stroke="#64748b" stroke-width="4"/>
  <rect x="125" y="140" width="50" height="8" fill="#334155"/> <!-- Seat -->
  <!-- Seated athlete -->
  <circle cx="150" cy="90" r="9" fill="#f59e0b"/>
  <line x1="150" y1="100" x2="150" y2="140" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="140" x2="150" y2="175" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Hands pushing machine overhead bar -->
  <line x1="90" y1="60" x2="210" y2="60" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="105" x2="115" y2="60" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="105" x2="185" y2="60" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
  <!-- Up arrow -->
  <path d="M 150,85 L 150,68 M 145,74 L 150,66 L 155,74" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="150" y="48" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">VERTIKAL DRÜCKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Schulterpresse-Maschine</text>
</svg>