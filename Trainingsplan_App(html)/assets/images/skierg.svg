<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-037" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-037)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-037</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-037">
    
  <!-- SkiErg tall pillar with 2 pulleys on top -->
  <rect x="140" y="20" width="20" height="155" fill="#334155"/>
  <circle cx="130" cy="30" r="6" fill="#0284c7"/>
  <circle cx="170" cy="30" r="6" fill="#0284c7"/>
  <!-- Athlete hinging, arms driving ski poles down -->
  <circle cx="105" cy="80" r="9" fill="#f59e0b"/>
  <line x1="105" y1="90" x2="115" y2="130" stroke="#1e293b" stroke-width="8"/>
  <line x1="115" y1="130" x2="105" y2="175" stroke="#1e293b" stroke-width="7"/>
  <!-- Two cords pulling down -->
  <line x1="130" y1="35" x2="115" y2="105" stroke="#64748b" stroke-width="2"/>
  <line x1="115" y1="105" x2="110" y2="145" stroke="#e11d48" stroke-width="6"/>
  <!-- Downward ski stroke arrows -->
  <path d="M 85,90 L 85,135 M 80,127 L 85,137 L 90,127" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="100" y="55" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">DOPPELSTOCKSCHUB</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">SkiErg-Maschine</text>
</svg>