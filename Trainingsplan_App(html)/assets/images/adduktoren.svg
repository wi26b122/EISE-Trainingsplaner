<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-026" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-026)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-026</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-026">
    
  <!-- Machine seat top down view -->
  <circle cx="150" cy="75" r="10" fill="#f59e0b"/>
  <rect x="135" y="90" width="30" height="35" rx="4" fill="#334155"/>
  <!-- Two pads on outside of knees pushing inward -->
  <rect x="90" y="95" width="12" height="28" rx="3" fill="#0284c7"/>
  <rect x="198" y="95" width="12" height="28" rx="3" fill="#0284c7"/>
  <!-- Inward arrows -->
  <path d="M 95,140 L 125,140 M 117,135 L 126,140 L 117,145" stroke="#059669" stroke-width="3" fill="none"/>
  <path d="M 205,140 L 175,140 M 183,135 L 174,140 L 183,145" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="150" y="160" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">NACH INNEN (SCHLIESSEN)</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Adduktoren-Maschine</text>
