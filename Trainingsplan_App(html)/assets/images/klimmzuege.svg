<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-004" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-004)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-004</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-004">
    
  <!-- Pullup bar and ceiling mounts -->
  <rect x="60" y="32" width="180" height="6" rx="3" fill="#334155"/>
  <rect x="70" y="15" width="8" height="20" fill="#64748b"/>
  <rect x="222" y="15" width="8" height="20" fill="#64748b"/>
  <!-- Athlete pulling chin over bar -->
  <circle cx="150" cy="45" r="9" fill="#f59e0b"/>
  <!-- Hands on bar -->
  <line x1="120" y1="35" x2="140" y2="58" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="35" x2="160" y2="58" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Body pulling up -->
  <line x1="150" y1="54" x2="150" y2="115" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="142" y2="165" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="115" x2="158" y2="165" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Up arrow -->
  <path d="M 195,110 L 195,70 M 190,78 L 195,68 L 200,78" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="200" y="55" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">HOCHZIEHEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Klimmzüge (Körpergewicht)</text>
</svg>