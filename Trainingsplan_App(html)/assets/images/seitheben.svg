  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-006">
    
  <line x1="100" y1="180" x2="200" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="150" cy="55" r="10" fill="#f59e0b"/>
  <line x1="150" y1="65" x2="150" y2="125" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="125" x2="140" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="125" x2="160" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Arms raised laterally horizontally -->
