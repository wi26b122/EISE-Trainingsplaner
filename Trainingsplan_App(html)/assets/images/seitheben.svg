  <line x1="150" y1="72" x2="210" y2="72" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <circle cx="85" cy="72" r="8" fill="#0284c7"/>
  <circle cx="215" cy="72" r="8" fill="#0284c7"/>
  <!-- Arcs indicating lateral lift -->
  <path d="M 115,110 Q 80,100 85,82" stroke="#059669" stroke-width="2.5" fill="none"/>
  <path d="M 185,110 Q 220,100 215,82" stroke="#059669" stroke-width="2.5" fill="none"/>
  <text x="150" y="40" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">SEITLICH ANHEBEN</text>

  </g>
  
