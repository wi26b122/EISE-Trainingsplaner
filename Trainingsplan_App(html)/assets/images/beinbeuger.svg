<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-024" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-024)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-024</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-024">
    
  <!-- Prone bench -->
  <rect x="60" y="135" width="140" height="10" rx="3" fill="#334155"/>
  <!-- Lying athlete -->
  <rect x="75" y="125" width="85" height="10" rx="4" fill="#1e293b"/>
  <circle cx="65" cy="130" r="9" fill="#f59e0b"/>
  <!-- Leg curling backwards to 90 deg -->
  <line x1="160" y1="130" x2="185" y2="100" stroke="#e11d48" stroke-width="7" stroke-linecap="round"/>
  <circle cx="187" cy="98" r="8" fill="#0284c7"/> <!-- Heel roller -->
  <!-- Curve to glutes -->
  <path d="M 195,130 Q 200,105 180,95" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="190" y="80" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">HERANBEUGEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Beinbeuger liegend</text>
</svg>