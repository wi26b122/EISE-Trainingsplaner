<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-035" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-035)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-035</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-035">
    
  <!-- Flywheel on right, monorail horizontal -->
  <line x1="50" y1="165" x2="240" y2="165" stroke="#334155" stroke-width="4"/>
  <circle cx="215" cy="140" r="24" fill="#0f172a"/> <!-- Flywheel housing -->
  <rect x="110" y="152" width="25" height="10" rx="2" fill="#0284c7"/> <!-- Sliding seat -->
  <!-- Rower on seat pulling chain -->
  <circle cx="95" cy="115" r="9" fill="#f59e0b"/>
  <line x1="95" y1="125" x2="120" y2="155" stroke="#e11d48" stroke-width="7"/>
  <line x1="120" y1="155" x2="155" y2="160" stroke="#1e293b" stroke-width="7"/> <!-- Legs driving -->
  <!-- Arms pulling handle from flywheel -->
  <line x1="102" y1="128" x2="145" y2="135" stroke="#1e293b" stroke-width="5"/>
  <line x1="145" y1="135" x2="195" y2="140" stroke="#64748b" stroke-width="2"/> <!-- Chain -->
  <text x="135" y="95" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">BEINABSTOSS & ZUG</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Ruderergometer (Concept2)</text>
</svg>