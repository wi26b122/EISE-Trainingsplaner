  <rect x="85" y="42" width="10" height="16" rx="2" fill="#0f172a"/>
  <rect x="205" y="42" width="10" height="16" rx="2" fill="#0f172a"/>
  <path d="M 150,75 L 150,58 M 145,64 L 150,56 L 155,64" stroke="#059669" stroke-width="3" fill="none"/>
