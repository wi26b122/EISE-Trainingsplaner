<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-015" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-015)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-015</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-015">
    
  <line x1="40" y1="180" x2="260" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Squatting posture -->
  <circle cx="120" cy="72" r="10" fill="#f59e0b"/>
  <!-- Barbell on back -->
  <line x1="85" y1="80" x2="160" y2="80" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <circle cx="87" cy="80" r="10" fill="#0f172a"/>
  <circle cx="158" cy="80" r="10" fill="#0f172a"/>
  <!-- Torso & thighs horizontal -->
  <line x1="120" y1="82" x2="132" y2="125" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="132" y1="125" x2="172" y2="125" stroke="#e11d48" stroke-width="9" stroke-linecap="round"/> <!-- Thigh -->
  <line x1="172" y1="125" x2="162" y2="178" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/> <!-- Shin -->
  <!-- Push up arrow -->
  <path d="M 190,140 L 190,105 M 184,113 L 190,103 L 196,113" stroke="#059669" stroke-width="3.5" fill="none"/>
  <text x="190" y="95" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">HOCHDRÜCKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Langhantel-Kniebeugen</text>
</svg>