<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-039" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-039)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-039</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-039">
    
  <!-- Machine tower -->
  <rect x="70" y="40" width="16" height="135" fill="#475569"/>
  <!-- Rotating shoulder yoke / chest pad -->
  <rect x="130" y="80" width="40" height="10" rx="3" fill="#0284c7"/>
  <!-- Athlete seated, pelvis stationary, turning ribcage -->
  <circle cx="150" cy="60" r="9" fill="#f59e0b"/>
  <line x1="150" y1="70" x2="150" y2="130" stroke="#e11d48" stroke-width="8"/>
  <line x1="150" y1="130" x2="150" y2="175" stroke="#1e293b" stroke-width="7"/>
  <!-- Torso twist arc -->
  <path d="M 120,95 Q 150,115 180,95" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="150" y="145" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">RUMPFDREHUNG</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Multistation Rumpfdrehen</text>
