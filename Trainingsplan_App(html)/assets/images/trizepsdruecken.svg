<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-013" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-013)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-013</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-013">
    
  <!-- Top cable pulley -->
  <circle cx="150" cy="30" r="7" fill="#475569"/>
  <line x1="150" y1="37" x2="150" y2="80" stroke="#64748b" stroke-width="2.5"/>
  <!-- Rope handle -->
  <line x1="140" y1="80" x2="160" y2="80" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Athlete standing close -->
  <circle cx="120" cy="65" r="9" fill="#f59e0b"/>
  <line x1="120" y1="75" x2="120" y2="135" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="135" x2="115" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="135" x2="130" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Arms locked pushing downward -->
  <line x1="120" y1="80" x2="138" y2="105" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="138" y1="105" x2="150" y2="130" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <!-- Downward arrow -->
  <path d="M 165,95 L 165,130 M 160,122 L 165,132 L 170,122" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="175" y="150" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">STRECKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Trizepsdrücken am Kabelzug</text>
</svg>