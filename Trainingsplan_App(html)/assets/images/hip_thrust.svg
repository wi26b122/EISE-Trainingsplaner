<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-021" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-021)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-021</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-021">
    
  <!-- Bench behind back -->
  <rect x="50" y="130" width="35" height="40" rx="3" fill="#334155"/>
  <!-- Shoulders on bench, hips bridge high -->
  <circle cx="85" cy="120" r="9" fill="#f59e0b"/>
  <line x1="85" y1="126" x2="140" y2="126" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/> <!-- Torso horizontal -->
  <line x1="140" y1="126" x2="165" y2="178" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/> <!-- Knees 90 deg -->
  <!-- Barbell on hips -->
  <circle cx="140" cy="122" r="11" fill="#0284c7"/>
  <!-- Up arrow at hips -->
  <path d="M 140,150 L 140,132 M 135,138 L 140,130 L 145,138" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="140" y="98" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">HÜFTE STRECKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Beckenheben (Hip Thrust) mit Langhantel</text>
</svg>