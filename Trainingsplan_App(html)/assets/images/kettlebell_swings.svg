<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-031" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-031)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-031</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-031">
    
  <line x1="40" y1="180" x2="260" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Athlete hip thrusting forward -->
  <circle cx="120" cy="65" r="10" fill="#f59e0b"/>
  <line x1="120" y1="75" x2="128" y2="125" stroke="#1e293b" stroke-width="8"/>
  <line x1="128" y1="125" x2="125" y2="178" stroke="#1e293b" stroke-width="7"/>
  <!-- Arms extended holding kettlebell at chest height -->
  <line x1="120" y1="80" x2="180" y2="80" stroke="#e11d48" stroke-width="6"/>
  <!-- Kettlebell ball & handle -->
  <circle cx="190" cy="80" r="11" fill="#0f172a"/>
  <circle cx="190" cy="74" r="5" fill="#f8fafc"/>
  <!-- Swing arc -->
  <path d="M 150,140 Q 185,120 185,95" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="185" y="60" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">HÜFTSCHWUNG</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Kettlebell Swings</text>
</svg>