<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-009" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-009)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-009</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-009">
    
  <!-- Cable tower top -->
  <rect x="110" y="25" width="80" height="8" rx="2" fill="#334155"/>
  <line x1="150" y1="33" x2="150" y2="55" stroke="#64748b" stroke-width="2.5"/>
  <!-- Wide lat bar -->
  <line x1="105" y1="58" x2="195" y2="58" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <!-- Seated athlete under bar -->
  <circle cx="150" cy="80" r="9" fill="#f59e0b"/>
  <line x1="150" y1="90" x2="150" y2="140" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="140" x2="175" y2="140" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="175" y1="140" x2="175" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Arms pulling down from bar -->
  <line x1="115" y1="58" x2="145" y2="92" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <line x1="185" y1="58" x2="155" y2="92" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Downward arrow -->
  <path d="M 210,65 L 210,95 M 205,88 L 210,96 L 215,88" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="210" y="112" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">ZUR BRUST</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Latzug zur Brust</text>
</svg>