<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-030" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-030)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-030</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-030">
    
  <line x1="30" y1="180" x2="270" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <!-- 1. Planka/pushup pose -->
  <circle cx="70" cy="148" r="7" fill="#f59e0b"/>
  <line x1="75" y1="150" x2="120" y2="160" stroke="#1e293b" stroke-width="6"/>
  <line x1="120" y1="160" x2="145" y2="176" stroke="#1e293b" stroke-width="5"/>
  <!-- 2. Jump up pose -->
  <circle cx="210" cy="45" r="9" fill="#f59e0b"/>
  <line x1="210" y1="55" x2="210" y2="105" stroke="#e11d48" stroke-width="7"/>
  <line x1="210" y1="105" x2="200" y2="145" stroke="#1e293b" stroke-width="6"/>
  <line x1="210" y1="105" x2="220" y2="145" stroke="#1e293b" stroke-width="6"/>
  <!-- Jump burst arrow -->
  <path d="M 235,110 L 235,65 M 230,75 L 235,63 L 240,75" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="160" y="100" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">LIEGESTÜTZ & SPRUNG</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Burpees mit Eigengewicht</text>
