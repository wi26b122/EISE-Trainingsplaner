<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-001" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-001)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-001</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-001">
    
  <!-- Flat Bench -->
  <rect x="60" y="140" width="180" height="12" rx="4" fill="#334155"/>
  <rect x="80" y="152" width="10" height="26" fill="#475569"/>
  <rect x="210" y="152" width="10" height="26" fill="#475569"/>
  <!-- Lying Athlete -->
  <rect x="80" y="132" width="105" height="10" rx="5" fill="#1e293b"/>
  <circle cx="70" cy="136" r="10" fill="#f59e0b"/>
  <line x1="185" y1="137" x2="215" y2="162" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="215" y1="162" x2="225" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- 2 Kurzhanteln -->
  <line x1="110" y1="135" x2="110" y2="82" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="80" r="10" fill="#0284c7"/>
  <line x1="150" y1="135" x2="150" y2="82" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="80" r="10" fill="#0284c7"/>
  <!-- Arrow UP -->
  <path d="M 130,115 L 130,90 M 125,97 L 130,88 L 135,97" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="70" font-size="10" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">KURZHANTELN HOCH</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Bankdrücken mit Kurzhanteln</text>
</svg>