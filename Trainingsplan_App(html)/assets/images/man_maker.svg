  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-034">
    
  <line x1="40" y1="180" x2="260" y2="180" stroke="#cbd5e1" stroke-width="3"/>
