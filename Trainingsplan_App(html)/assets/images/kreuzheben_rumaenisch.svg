<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-016" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-016)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-016</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • FREIGEWICHT</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-016">
    
  <line x1="40" y1="180" x2="260" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="100" cy="85" r="10" fill="#f59e0b"/>
  <line x1="100" y1="95" x2="148" y2="115" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <!-- Hamstring tension / almost straight legs -->
  <line x1="148" y1="115" x2="158" y2="178" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <!-- Arms holding bar at knee level -->
  <line x1="115" y1="100" x2="115" y2="145" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="115" cy="148" r="9" fill="#0284c7"/>
  <!-- Hip hinge arrow -->
  <path d="M 130,105 Q 160,95 165,115" stroke="#059669" stroke-width="2.5" fill="none"/>
  <text x="175" y="100" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">HÜFT-HINGE</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Rumänisches Kreuzheben</text>
</svg>