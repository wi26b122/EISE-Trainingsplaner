<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-008" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-008)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-008</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-008">
    
  <!-- Machine frame & seat -->
  <rect x="75" y="70" width="10" height="110" fill="#475569"/>
  <rect x="75" y="140" width="50" height="8" fill="#334155"/>
  <rect x="70" y="80" width="10" height="60" rx="3" fill="#0284c7"/> <!-- Backrest -->
  <!-- Seated athlete -->
  <circle cx="95" cy="85" r="9" fill="#f59e0b"/>
  <line x1="90" y1="95" x2="90" y2="140" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="140" x2="135" y2="140" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="135" y1="140" x2="135" y2="178" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Pushing machine handle forward -->
  <line x1="90" y1="100" x2="145" y2="100" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <rect x="145" y="88" width="6" height="24" rx="2" fill="#0f172a"/>
  <!-- Forward arrow -->
  <path d="M 120,115 L 160,115 M 153,110 L 162,115 L 153,120" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="155" y="78" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">VORDRÜCKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Brustpresse am Gerät</text>
</svg>