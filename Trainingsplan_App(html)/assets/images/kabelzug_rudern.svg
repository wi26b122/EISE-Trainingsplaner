<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-010" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-010)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-010</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-010">
    
  <!-- Seated low row bench & pulley -->
  <rect x="60" y="145" width="110" height="10" fill="#334155"/>
  <rect x="210" y="110" width="20" height="70" fill="#475569"/>
  <circle cx="210" cy="130" r="6" fill="#0284c7"/> <!-- Pulley -->
  <!-- Cable -->
  <line x1="165" y1="125" x2="210" y2="130" stroke="#64748b" stroke-width="2"/>
  <!-- Athlete seated upright -->
  <circle cx="115" cy="95" r="9" fill="#f59e0b"/>
  <line x1="115" y1="105" x2="115" y2="145" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <line x1="115" y1="145" x2="175" y2="145" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Arms pulling handle to chest -->
  <line x1="115" y1="110" x2="160" y2="125" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Pull arrow -->
  <path d="M 185,115 L 145,115 M 153,110 L 143,115 L 153,120" stroke="#059669" stroke-width="3" fill="none"/>
  <text x="160" y="100" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">ZUM BAUCH</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Kabelzug Rudern sitzend</text>
</svg>