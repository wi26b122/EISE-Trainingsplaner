<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-022" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-022)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#047857"/>
  <rect x="0" y="12" width="300" height="13" fill="#047857"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-022</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">UNTERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-022">
    
  <!-- 45-degree guide rail -->
  <line x1="70" y1="160" x2="210" y2="60" stroke="#64748b" stroke-width="4"/>
  <!-- Sled on rail -->
  <rect x="175" y="70" width="28" height="14" rx="3" transform="rotate(-35 175 70)" fill="#0284c7"/>
  <!-- Reclined seat -->
  <rect x="70" y="145" width="40" height="8" rx="2" fill="#334155"/>
  <circle cx="85" cy="130" r="9" fill="#f59e0b"/>
  <!-- Legs extending up the ramp -->
  <line x1="95" y1="145" x2="135" y2="120" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <line x1="135" y1="120" x2="175" y2="85" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Arrow along 45 deg ramp -->
  <path d="M 145,100 L 180,75" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <text x="170" y="50" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">45° DRÜCKEN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Beinpresse 45°</text>
</svg>