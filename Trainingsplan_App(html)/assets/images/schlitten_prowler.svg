<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-040" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-040)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#b45309"/>
  <rect x="0" y="12" width="300" height="13" fill="#b45309"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-040</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">GANZKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-040">
    
  <line x1="30" y1="180" x2="270" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Sled runners on turf -->
  <line x1="170" y1="178" x2="245" y2="178" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <!-- Two vertical push poles -->
  <line x1="185" y1="90" x2="185" y2="175" stroke="#0284c7" stroke-width="5"/>
  <line x1="205" y1="90" x2="205" y2="175" stroke="#0284c7" stroke-width="5"/>
  <!-- Athlete leaning forward at 45 degrees, driving into the poles -->
  <circle cx="105" cy="95" r="9" fill="#f59e0b"/>
  <line x1="105" y1="102" x2="145" y2="135" stroke="#1e293b" stroke-width="8"/>
  <line x1="145" y1="135" x2="130" y2="178" stroke="#e11d48" stroke-width="7"/> <!-- Sprint leg -->
  <line x1="145" y1="135" x2="170" y2="170" stroke="#e11d48" stroke-width="7"/>
  <!-- Arms straight into poles -->
  <line x1="115" y1="108" x2="185" y2="115" stroke="#1e293b" stroke-width="6"/>
  <!-- Sled forward drive arrow -->
  <path d="M 215,130 L 250,130 M 242,125 L 252,130 L 242,135" stroke="#059669" stroke-width="3.5" fill="none"/>
  <text x="215" y="75" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669">SCHLITTENSCHUB</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Schlitten ziehen/schieben (Prowler)</text>
</svg>