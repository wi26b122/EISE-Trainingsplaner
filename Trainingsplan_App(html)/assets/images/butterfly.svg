<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_UEB-012" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="210" rx="14" fill="url(#bgGrad_UEB-012)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Banner with exercise ID and Split -->
  <rect x="0" y="0" width="300" height="25" rx="14" fill="#1d4ed8"/>
  <rect x="0" y="12" width="300" height="13" fill="#1d4ed8"/>
  <text x="15" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" opacity="0.85">UEB-012</text>
  <text x="150" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">OBERKÖRPER • MASCHINE</text>
  
  <!-- Unique Motion Drawing -->
  <g id="illustration_UEB-012">
    
  <!-- Machine backrest -->
  <rect x="145" y="65" width="10" height="90" rx="3" fill="#0284c7"/>
  <circle cx="150" cy="55" r="9" fill="#f59e0b"/>
  <!-- Forearms on vertical pads hugging inwards -->
  <rect x="95" y="70" width="8" height="35" rx="3" fill="#e11d48"/>
  <rect x="195" y="70" width="8" height="35" rx="3" fill="#e11d48"/>
  <line x1="150" y1="75" x2="100" y2="85" stroke="#1e293b" stroke-width="5"/>
  <line x1="150" y1="75" x2="200" y2="85" stroke="#1e293b" stroke-width="5"/>
  <!-- Inward convergent arrows -->
  <path d="M 90,115 Q 120,125 135,110" stroke="#059669" stroke-width="2.5" fill="none"/>
  <path d="M 210,115 Q 180,125 165,110" stroke="#059669" stroke-width="2.5" fill="none"/>
  <text x="150" y="135" font-size="9" font-family="sans-serif" font-weight="bold" fill="#059669" text-anchor="middle">ZUSAMMENFÜHREN</text>

  </g>
  
  <!-- Bottom info bar -->
  <rect x="8" y="184" width="284" height="20" rx="6" fill="#0f172a" opacity="0.06"/>
  <text x="150" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1e293b">Butterfly (Pec Deck)</text>
</svg>