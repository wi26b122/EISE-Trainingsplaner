<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainingsplan App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 450px;
      min-width: 320px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    header {
      background: #0f172a;
      color: #ffffff;
      padding: 24px 20px;
    }
    header h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    header p {
      font-size: 13px;
      color: #94a3b8;
    }
    .main-content {
      padding: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }
    select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background-color: #f8fafc;
      color: #0f172a;
      outline: none;
    }
    select:focus {
      border-color: #0d9488;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #0d9488;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0f766e;
    }
    .btn-secondary {
      background-color: #e2e8f0;
      color: #1e293b;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      width: auto;
    }
    .message-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .message-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .plan-section {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }
    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .plan-header h2 {
      font-size: 17px;
      color: #0f172a;
    }
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .exercise-card {
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      background: #ffffff;
      display: flex;
      gap: 12px;
      transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }
    .exercise-card:hover {
      border-color: #0d9488;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.12);
    }
    .exercise-card.completed {
      background: #f8fafc;
      border-color: #cbd5e1;
      opacity: 0.65;
    }
    .exercise-card.completed h4 {
      text-decoration: line-through;
    }
    .exercise-img {
      width: 100px;
      height: 85px;
      border-radius: 8px;
      object-fit: contain;
      background: #f8fafc;
      flex-shrink: 0;
      border: 1px solid #cbd5e1;
      display: block;
    }
    .exercise-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .exercise-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }
    .exercise-details h4 {
      font-size: 14px;
      color: #0f172a;
      line-height: 1.25;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
      margin-top: 4px;
    }
    .hint-click {
      font-size: 11px;
      color: #0d9488;
      font-weight: 600;
      margin-top: 5px;
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
      user-select: none;
    }
    .checkbox-label input {
      accent-color: #0d9488;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .completion-banner {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      text-align: center;
      display: none;
      animation: popIn 0.4s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .modal-header {
      background: #0f172a;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      text-align: center;
    }
    .modal-img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      margin-bottom: 14px;
    }
    .modal-instruction {
      font-size: 13.5px;
      color: #1e293b;
      line-height: 1.5;
      text-align: left;
      background: #f8fafc;
      padding: 14px;
      border-radius: 8px;
      border-left: 4px solid #0d9488;
      border: 1px solid #e2e8f0;
    }
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <header>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>🏋️ Trainingsplan</h1>
        </div>
      <p>Workout generieren, Übungen anklicken &amp; trainieren</p>
    </header>

    <div class="main-content">
      <div class="form-group">
        <label for="select-zeit">Trainingszeit</label>
        <select id="select-zeit">
          <option value="30">30 Minuten (3 Übungen)</option>
          <option value="50" selected>50 Minuten (5 Übungen)</option>
          <option value="60">60 Minuten (6 Übungen)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="select-split">Trainingssplit</label>
        <select id="select-split">
          <option value="Oberkörper">Oberkörper</option>
          <option value="Unterkörper">Unterkörper</option>
          <option value="Ganzkörper" selected>Ganzkörper</option>
        </select>
      </div>

      <div class="form-group">
        <label for="select-art">Trainingspräferenz</label>
        <select id="select-art">
          <option value="Beides" selected>Beides (50/50)</option>
          <option value="Freigewicht">Nur Freigewichte</option>
          <option value="Maschine">Nur Maschinen</option>
        </select>
      </div>

      <button id="btn-generieren" class="btn btn-primary">Trainingsplan erstellen</button>

      <div id="error-box" class="message-box message-error"></div>

      <section id="plan-section" class="plan-section" style="display: none;">
        <div class="plan-header">
          <h2>Dein aktiver Plan</h2>
          <span id="plan-info" style="font-size: 12px; color: #64748b;"></span>
        </div>

        <div id="exercise-list" class="exercise-list"></div>

        <div id="completion-banner" class="completion-banner">
          <h3>🎉 Workout abgeschlossen!</h3>
          <p style="font-size: 13px; margin-top: 4px;">Großartige Leistung! Alle Übungen wurden erfolgreich absolviert.</p>
        </div>

        <button id="btn-export" class="btn btn-secondary">Plan als Text exportieren</button>
      </section>
    </div>
  </div>

  <!-- Detail Modal für Übungsdurchführung -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Übungsdetails</h3>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modal-img" src="" alt="Übungsdurchführung" class="modal-img">
        <div style="text-align: left; margin-bottom: 10px;">
          <span id="modal-meta" class="badge"></span>
        </div>
        <p id="modal-desc" class="modal-instruction"></p>
      </div>
    </div>
  </div>

    // Liefert garantiert für jede Übung ihr individuelles Bild
    function getExerciseImage(u) {
      if (u && u.id && IMAGE_LOOKUP[u.id]) {
        return IMAGE_LOOKUP[u.id];
      }
      if (u && u.bild_data_uri) {
        return u.bild_data_uri;
      }
      if (u && u.bild_dateiname) {
        return "assets/images/" + u.bild_dateiname;
      }
      return "";
    }

    let alleUebungen = [...EMBEDDED_DATABASE];
    let aktiverPlan = null;

    // 1. Array Shuffler
    function mischeArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 2. Plan-Generierung (REQ-FUNC-01)
    function generierePlan(zeitMin, split, praeferenz) {
      const anzahl = zeitMin / 10;
      let splitGefiltert = alleUebungen.filter(u => u.split === split);
      if (split === "Ganzkörper" && splitGefiltert.length < anzahl) {
        splitGefiltert = alleUebungen;
      }

      let freie = splitGefiltert.filter(u => u.art === "Freigewicht");
      let maschinen = splitGefiltert.filter(u => u.art === "Maschine");
      let gewaehlt = [];

      if (praeferenz === "Freigewicht") {
        if (freie.length < anzahl) {
          zeigeFehler("Nicht genügend Freigewichtsübungen für " + split + " verfügbar.");
          return null;
        }
        gewaehlt = mischeArray(freie).slice(0, anzahl);
      } else if (praeferenz === "Maschine") {
        if (maschinen.length < anzahl) {
          zeigeFehler("Nicht genügend Maschinenübungen für " + split + " verfügbar.");
          return null;
        }
        gewaehlt = mischeArray(maschinen).slice(0, anzahl);
      } else {
        const anzahlFrei = Math.ceil(anzahl / 2);
        const anzahlMaschine = Math.floor(anzahl / 2);
        if (freie.length < anzahlFrei || maschinen.length < anzahlMaschine) {
          zeigeFehler("Nicht genügend Übungen zur Erstellung einer 50/50-Kombination vorhanden.");
          return null;
        }
        const freiAuswahl = mischeArray(freie).slice(0, anzahlFrei);
        const maschinenAuswahl = mischeArray(maschinen).slice(0, anzahlMaschine);
        gewaehlt = mischeArray([...freiAuswahl, ...maschinenAuswahl]);
      }

      verbergeFehler();
      return {
        erstelltAm: new Date().toISOString(),
        zeitMin,
        split,
        praeferenz,
        uebungen: gewaehlt.map(u => ({
          ...u,
          bild_data_uri: getExerciseImage(u),
          erledigt: false
        }))
      };
    }

    // 3. Übung austauschen (REQ-FUNC-03)
    function tauscheUebung(index) {
      if (!aktiverPlan || !aktiverPlan.uebungen[index]) return;
      const alte = aktiverPlan.uebungen[index];
      const gewaehlteIds = aktiverPlan.uebungen.map(u => u.id);

      let moegliche = alleUebungen.filter(u => u.split === alte.split && u.art === alte.art && !gewaehlteIds.includes(u.id));
      if (moegliche.length === 0) {
        moegliche = alleUebungen.filter(u => u.split === alte.split && !gewaehlteIds.includes(u.id));
      }

      if (moegliche.length === 0) {
        alert("Keine weiteren alternativen Übungen in der Datenbank gefunden.");
        return;
      }

      const neue = mischeArray(moegliche)[0];
      aktiverPlan.uebungen[index] = {
        ...neue,
        bild_data_uri: getExerciseImage(neue),
        erledigt: false
      };
      speicherePlan();
      renderePlan();
    }

    // 4. Status ändern (REQ-FUNC-04) & Konfetti-Trigger (REQ-FUNC-09)
    function toggleErledigt(index) {
      if (!aktiverPlan || !aktiverPlan.uebungen[index]) return;
      aktiverPlan.uebungen[index].erledigt = !aktiverPlan.uebungen[index].erledigt;
      speicherePlan();
      renderePlan();

      const alleErledigt = aktiverPlan.uebungen.every(u => u.erledigt);
      if (alleErledigt) {
        starteKonfetti();
      }
    }

    // 5. Modal Anzeige für Detailansicht (REQ-FUNC-08)
    function zeigeModal(uebung) {
      document.getElementById("modal-title").textContent = uebung.name;
      const img = document.getElementById("modal-img");
      img.src = getExerciseImage(uebung);
      document.getElementById("modal-meta").textContent = uebung.dauer_min + " Min • " + uebung.art + " • " + uebung.split;
      document.getElementById("modal-desc").textContent = uebung.anleitung;
      document.getElementById("modal-overlay").style.display = "flex";
    }

    document.getElementById("modal-close").addEventListener("click", () => {
      document.getElementById("modal-overlay").style.display = "none";
    });
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") {
        document.getElementById("modal-overlay").style.display = "none";
      }
    });

    // 6. Plan Rendern
    function renderePlan() {
      const section = document.getElementById("plan-section");
      const list = document.getElementById("exercise-list");
      const info = document.getElementById("plan-info");
      const banner = document.getElementById("completion-banner");

      if (!aktiverPlan || aktiverPlan.uebungen.length === 0) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";
      const erledigtAnzahl = aktiverPlan.uebungen.filter(u => u.erledigt).length;
      const gesamt = aktiverPlan.uebungen.length;
      info.textContent = erledigtAnzahl + " von " + gesamt + " erledigt (" + aktiverPlan.zeitMin + " Min)";

      if (erledigtAnzahl === gesamt && gesamt > 0) {
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }

      list.innerHTML = "";

      aktiverPlan.uebungen.forEach((u, idx) => {
        const card = document.createElement("div");
        card.className = "exercise-card " + (u.erledigt ? "completed" : "");
        const imgSrc = getExerciseImage(u);

        card.innerHTML = `
          <img src="${imgSrc}" alt="${u.name}" class="exercise-img">
          <div class="exercise-details">
            <div class="card-clickable-area" data-index="${idx}">
              <div class="exercise-title-row">
                <h4>${idx + 1}. ${u.name}</h4>
              </div>
              <span class="badge">${u.dauer_min} Min • ${u.art} • ${u.split}</span>
              <p class="hint-click">🔍 Bild &amp; Durchführung anzeigen</p>
            </div>
            <div class="card-actions">
              <label class="checkbox-label" onclick="event.stopPropagation();">
                <input type="checkbox" ${u.erledigt ? "checked" : ""} data-index="${idx}">
                Erledigt
              </label>
              <button class="btn btn-secondary btn-sm" data-action="swap" data-index="${idx}" onclick="event.stopPropagation();">Tauschen</button>
            </div>
          </div>
        `;

        card.querySelector(".card-clickable-area").addEventListener("click", () => {
          zeigeModal(u);
        });

        list.appendChild(card);
      });

      list.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", (e) => {
          toggleErledigt(parseInt(e.target.getAttribute("data-index"), 10));
        });
      });

      list.querySelectorAll("button[data-action=swap]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          tauscheUebung(parseInt(e.target.getAttribute("data-index"), 10));
        });
      });
    }

    // 7. Persistenz mit Cache-Reparatur
    function speicherePlan() {
      if (aktiverPlan) {
        localStorage.setItem("trainingsplan_app_state_v3", JSON.stringify(aktiverPlan));
      }
    }

    function ladeGespeichertenPlan() {
      // v3 ist die bereinigte Version mit validem XML
      let saved = localStorage.getItem("trainingsplan_app_state_v3");
      if (!saved) {
        saved = localStorage.getItem("trainingsplan_app_state_v2") || localStorage.getItem("trainingsplan_app_state");
      }
      if (saved) {
        try {
          aktiverPlan = JSON.parse(saved);
          // Automatische Reparatur: jedes Bild anhand der ID neu binden
          if (aktiverPlan && aktiverPlan.uebungen) {
            aktiverPlan.uebungen.forEach(u => {
              u.bild_data_uri = getExerciseImage(u);
            });
          }
          renderePlan();
          return;
        } catch(e) {
          console.error(e);
        }
      }
      // Neu initialisieren
      aktiverPlan = generierePlan(50, "Ganzkörper", "Beides");
      if (aktiverPlan) {
        speicherePlan();
        renderePlan();
      }
    }

    // 8. Export
    function exportierePlan() {
      if (!aktiverPlan) return;
      let text = "=== TRAININGSPLAN (" + aktiverPlan.zeitMin + " MINUTEN) ===\n";
      text += "Split: " + aktiverPlan.split + " | Präferenz: " + aktiverPlan.praeferenz + "\n";
      text += "Datum: " + new Date(aktiverPlan.erstelltAm).toLocaleDateString() + "\n\n";

      aktiverPlan.uebungen.forEach((u, i) => {
        text += (i + 1) + ". [" + (u.erledigt ? "X" : " ") + "] " + u.name + " (" + u.dauer_min + " Min, " + u.art + ")\n";
        text += "   Anleitung: " + u.anleitung + "\n\n";
      });

      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Trainingsplan_" + aktiverPlan.split + "_" + aktiverPlan.zeitMin + "min.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function zeigeFehler(msg) {
      const b = document.getElementById("error-box");
      b.textContent = msg;
      b.style.display = "block";
    }
    function verbergeFehler() {
      document.getElementById("error-box").style.display = "none";
    }

    // 9. Konfetti Partikelsystem
    function starteKonfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ["#0d9488", "#10b981", "#f59e0b", "#ef4444", "#3b82f6", "#8b5cf6"];

      for (let i = 0; i < 160; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight * 0.45,
          w: Math.random() * 8 + 4,
          h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 10 - 4,
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: (Math.random() * 0.07) + 0.05
        });
      }

      let frames = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy = Math.min(p.vy + 0.08, 1.8); // Sanftere Schwerkraft für langsameres Fallen
          p.vx *= 0.98; // Leichter Luftwiderstand
          p.tiltAngle += p.tiltAngleInc * 0.7;
          p.tilt = Math.sin(p.tiltAngle) * 10;

          if (p.y < canvas.height + 20) {
            active = true;
            ctx.beginPath();
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
          }
        });

        frames++;
        if (active && frames < 350) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // Event Listener
    document.getElementById("btn-generieren").addEventListener("click", () => {
      const zeit = parseInt(document.getElementById("select-zeit").value, 10);
      const split = document.getElementById("select-split").value;
      const art = document.getElementById("select-art").value;

      aktiverPlan = generierePlan(zeit, split, art);
      if (aktiverPlan) {
        speicherePlan();
        renderePlan();
      }
    });

    document.getElementById("btn-export").addEventListener("click", exportierePlan);

    // Initialisierung
    ladeGespeichertenPlan();
  </script>
</body>
